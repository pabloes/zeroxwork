  <!-- Enlaces de un solo uso (verificar correo, contraseña nueva, confirmar correo): el token
       se saca de la dirección antes de que nada más la lea. Analytics y AdSense, que se cargan
       al final del body, envían la URL de la página; así no ven el token, ni se queda en el
       historial. La app lo recoge de window.__zxLinkToken (src/services/link-token.ts). -->
  <script>
    (function () {
      function lift() {
        var path = location.pathname.replace(/\/+$/, '');
        if (path !== '/verify' && path !== '/reset-password' && path !== '/confirm-email') return;

        // el fragmento manda (no viaja al servidor); la query es de los correos antiguos
        var match = /[#&]token=([^&]*)/.exec(location.hash) || /[?&]token=([^&]*)/.exec(location.search);
        if (!match || !match[1]) return;

        var token = match[1];
        try { token = decodeURIComponent(token); } catch (e) { /* se queda tal cual */ }

        window.__zxLinkToken = { path: path, token: token };
        try { history.replaceState(null, '', location.pathname); } catch (e) { /* sin history API */ }
      }

      lift();

      // Abrir un enlace estando ya en esa misma página solo cambia el fragmento: no hay
      // carga, este script no vuelve a ejecutarse y el token se quedaría en la dirección
      // sin que nadie lo atienda. Se recarga para que entre por el camino de siempre.
      window.addEventListener('hashchange', function () {
        if (/[#&]token=/.test(location.hash)) location.reload();
      });
    })();
  </script>

  <!-- Tema: elección guardada, si no la del sistema. Antes del primer pintado -->
  <script>
    (function () {
      var t;
      try { t = localStorage.getItem('zx-theme'); } catch (e) { /* storage bloqueado */ }
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

<!-- Consentimiento de cookies: el aviso lo pinta React (traducido), aquí solo vive la carga de scripts -->
<script>
  // Función para cargar Google Analytics
  function loadGoogleAnalytics() {
    const script = document.createElement('script');
    script.async = true;
    script.src = `https://www.googletagmanager.com/gtag/js?id=G-VRK5XLEKNL`;
    document.head.appendChild(script);
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VRK5XLEKNL');
  }

  // Función para cargar Google AdSense
  function loadGoogleAdSense() {
    const script = document.createElement('script');
    script.async = true;
    script.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9225623006292034";
    script.crossorigin = "anonymous";
    document.head.appendChild(script);
  }

  // Llamado por el aviso de cookies de React al aceptar
  window.zxAcceptCookies = function () {
    try { localStorage.setItem('cookiesAccepted', 'true'); } catch (e) { /* storage bloqueado */ }
    loadGoogleAnalytics();
    loadGoogleAdSense();
  };

  // Cargar los scripts si las cookies ya fueron aceptadas
  try {
    if (localStorage.getItem('cookiesAccepted')) {
      loadGoogleAnalytics();
      loadGoogleAdSense();
    }
  } catch (e) { /* storage bloqueado: sin analytics hasta que se acepte */ }
</script>
