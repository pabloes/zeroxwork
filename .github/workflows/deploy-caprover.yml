name: Deploy to CapRover

on:
  push:
    branches:
      - main

# Prevent concurrent deploys — queue newer runs, cancel nothing
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Generous on purpose: the bot's upload has taken 17 minutes to be
    # acknowledged while the server was still busy with the website's build.
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install caprover-cli
        run: npm install -g caprover

      - name: Deploy to CapRover
        run: |
          caprover deploy \
            --caproverUrl "${{ secrets.CAPROVER_SERVER }}" \
            --appName "${{ secrets.CAPROVER_APP }}" \
            --appToken "${{ secrets.CAPROVER_TOKEN }}" \
            --branch main

      - name: Health check
        run: |
          APP_URL="${{ secrets.APP_URL }}"
          if [ -z "$APP_URL" ]; then
            echo "::warning::APP_URL secret not set, skipping health check"
            exit 0
          fi

          echo "Waiting 60s for container startup (prisma migrate + app init)..."
          sleep 60

          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/api/blog/articles" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            sleep 15
          done

          echo "::error::Health check failed after $MAX_RETRIES attempts (last status: $STATUS)"
          exit 1

      # The bot shares the database schema with the website, so it is updated in
      # the same run, once the website's upload is accepted and the site answers
      # the health check. That does not mean the new website is live yet: with an
      # app token the CLI returns when the upload is acknowledged, and CapRover
      # builds afterwards. The bot copes with starting first, because its
      # periodic passes log a failed query and try again on the next round.
      # CapRover finds the bot's image through the app's Captain Definition Path,
      # which must be ./captain-definition-bot. See DISCORD.md.
      - name: Deploy Discord bot to CapRover
        env:
          CAPROVER_BOT_TOKEN: ${{ secrets.CAPROVER_BOT_TOKEN }}
        run: |
          if [ -z "$CAPROVER_BOT_TOKEN" ]; then
            echo "::warning::CAPROVER_BOT_TOKEN secret not set, skipping the bot deploy"
            exit 0
          fi

          caprover deploy \
            --caproverUrl "${{ secrets.CAPROVER_SERVER }}" \
            --appName "zerox-discord-bot" \
            --appToken "$CAPROVER_BOT_TOKEN" \
            --branch main
